<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 我的工作台</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

<div class="app">

    <!-- 顶部 -->
    <header>
        <h1>🌟 我的工作台</h1>
        <p id="greeting">下午好 👋</p>
    </header>


    <!-- 首页 -->
<section id="home">

    <div class="card progress-card">

        <h2>今日完成率</h2>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <h3 id="progressText">0%</h3>

    </div>



    <div class="card">

        <div class="title-row">

            <h2>📌 今日任务</h2>

            <button onclick="showAddTask()">
                + 新任务
            </button>

        </div>


        <div id="taskList"></div>

    </div>



    <div class="card">

        <h2>🎯 我的目标</h2>

        <div class="goal">

            <h3>打造个人工作台 App</h3>

            <div class="progress">

                <div style="width:70%"></div>

            </div>

            <p>完成度 70%</p>

        </div>

    </div>



    <div class="card">

        <h2>📝 今日记录</h2>

        <textarea 
        id="diary"
        placeholder="今天完成：

遇到问题：

明天计划："></textarea>

    </div>


</section>





<section id="tasks" class="page hidden">

    <div class="card">

        <h2>☑️ 全部任务</h2>

        <div id="allTasks"></div>

    </div>

</section>





<section id="goals" class="page hidden">

    <div class="card">

        <h2>🎯 我的目标</h2>

        <p>
        打造个人工作台 App
        </p>


        <div class="progress">

            <div style="width:70%"></div>

        </div>


    </div>

</section>





<section id="diaryPage" class="page hidden">

    <div class="card">

        <h2>📝 日记</h2>

        <textarea placeholder="记录今天..."></textarea>

    </div>

</section>





<section id="stats" class="page hidden">

    <div class="card">

        <h2>📊 统计</h2>

        <h1>0</h1>

        <p>
        已完成任务
        </p>

    </div>

</section>

    <!-- 添加任务窗口 -->

<div id="taskBox" class="popup hidden">

    <div class="popup-content">

        <h2>添加任务</h2>

        <input 
        id="taskInput"
        placeholder="任务名称">


        <button onclick="addTask()">
            保存
        </button>


        <button onclick="closeTask()">
            取消
        </button>

    </div>

</div>


</div>


<!-- 底部导航 -->

<!-- 底部导航 -->

<nav class="bottom-nav">

    <div class="nav-item active" onclick="switchPage('home',this)">
        🏠
        <span>首页</span>
    </div>


    <div class="nav-item" onclick="switchPage('tasks',this)">
        ☑️
        <span>任务</span>
    </div>


    <div class="nav-item" onclick="switchPage('goals',this)">
        🎯
        <span>目标</span>
    </div>


    <div class="nav-item" onclick="switchPage('diaryPage',this)">
        📝
        <span>日记</span>
    </div>


    <div class="nav-item" onclick="switchPage('stats',this)">
        📊
        <span>统计</span>
    </div>

</nav>


<script src="app.js?v=5"></script>


</body>

</html>
